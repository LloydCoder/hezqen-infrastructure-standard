# TEMPLATE ONLY — do not enable until product-specific release building, signing, provenance, and registry settings are configured.
name: Product Release

on:
  push:
    tags:
      - "ik*-v*"

permissions:
  contents: read

concurrency:
  group: product-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact product release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Resolve product workspace from tag
        id: product
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            ik01-v*) echo "path=products/local-ai-deployment" >> "$GITHUB_OUTPUT" ;;
            ik02-v*) echo "path=products/pii-protection" >> "$GITHUB_OUTPUT" ;;
            ik03-v*) echo "path=products/multigpu-optimization" >> "$GITHUB_OUTPUT" ;;
            ik04-v*) echo "path=products/airgapped-rag" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported product tag: ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac
      - name: Verify selected product manifest and source
        run: |
          test -s "${{ steps.product.outputs.path }}/product-manifest.json"
          python scripts/validate-manifest.py "${{ steps.product.outputs.path }}/product-manifest.json"
      - name: Build and test selected product artifact
        run: |
          echo "REPLACE with deterministic product-specific build and acceptance tests"
          exit 1
      - name: Generate SBOM, checksums, and release manifest
        run: |
          echo "REPLACE with verified CycloneDX SBOM generation and HIES metadata scripts"
          exit 1
      - name: Generate build provenance and sign artifacts
        run: |
          echo "REPLACE with an approved provenance and signing implementation"
          exit 1
      - name: Verify release outputs before publication
        run: |
          echo "REPLACE with checksum, signature, provenance, and SBOM verification"
          exit 1
