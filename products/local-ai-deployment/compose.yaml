name: hezqen-local-ai

services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
      args:
        BASE_IMAGE: ${OLLAMA_BASE_IMAGE:-ollama/ollama:0.40.16}
    image: ${OLLAMA_IMAGE:-hezqen/ollama:0.40.16-nonroot}
    user: "10002:10002"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 4096
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-16g}
    cpus: ${OLLAMA_CPUS:-2.0}
    environment:
      HOME: /home/ollama
      OLLAMA_MODELS: /home/ollama/.ollama/models
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/home/ollama/.ollama
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g,uid=10002,gid=10002,mode=0700
    networks:
      - inference
      - model-egress
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile.open-webui
      args:
        BASE_IMAGE: ${OPEN_WEBUI_BASE_IMAGE:-ghcr.io/open-webui/open-webui:v0.13.2-slim}
    image: ${OPEN_WEBUI_IMAGE:-hezqen/open-webui:0.13.2-slim-nonroot}
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    mem_limit: ${WEBUI_MEMORY_LIMIT:-2g}
    cpus: ${WEBUI_CPUS:-1.0}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      HOME: /root
      OLLAMA_BASE_URL: http://ollama:11434
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: nomic-embed-text
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in the local .env file}
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: "true"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
    expose:
      - "8080"
    ports:
      - "${WEBUI_BIND_ADDRESS:-127.0.0.1}:${WEBUI_PORT:-3000}:8080"
    volumes:
      - open_webui_data:/app/backend/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /root/.cache:rw,noexec,nosuid,size=256m,uid=10001,gid=10001,mode=0700
    networks:
      - ui-ingress
      - inference
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --silent --fail http://localhost:8080/health | jq -ne 'input.status == true' || exit 1"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s

networks:
  inference:
    driver: bridge
    internal: true
  model-egress:
    driver: bridge
  ui-ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"

volumes:
  ollama_data:
  open_webui_data:
