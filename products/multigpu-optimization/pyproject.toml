[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hezqen-multigpu-optimization"
version = "0.1.0"
description = "Conservative model-memory estimator and vLLM parallelism planner"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
hezqen-gpu-plan = "hezqen_gpu_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
