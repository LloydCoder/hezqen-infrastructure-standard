name: IK-03 Multi-GPU Planner Acceptance

on:
  pull_request:
    paths:
      - "products/multigpu-optimization/**"
      - ".github/workflows/ik03-runtime.yml"
  push:
    branches: [main]
    paths:
      - "products/multigpu-optimization/**"
      - ".github/workflows/ik03-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ik03-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planner:
    name: CPU-only estimator, CLI, and configuration acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned Python runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
      - name: Run product planner and CLI tests
        working-directory: products/multigpu-optimization
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Verify CLI help and machine-readable output
        working-directory: products/multigpu-optimization
        env:
          PYTHONPATH: src
        run: |
          python -m hezqen_gpu_planner --help >/dev/null
          python -m hezqen_gpu_planner \
            --model org/example-70b --params-b 70 --layers 80 --kv-heads 8 --head-dim 128 \
            --model-context 32768 --context 8192 --concurrency 8 \
            --gpus-per-node 4 --nodes 1 --vram-gib 24 --tp 4 --pp 1 \
            --weight-dtype int4 --quantization awq --output "$RUNNER_TEMP/hezqen-gpu-plan.json"
          python - "$RUNNER_TEMP/hezqen-gpu-plan.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          plan = json.loads(Path(sys.argv[1]).read_text())
          assert plan["model"]["name"] == "org/example-70b"
          assert "--tensor-parallel-size 4" in plan["vllm"]["shell_command"]
          assert plan["memory"]["estimated_fit"] is True
          print("IK-03 planner CLI acceptance passed")
          PY
      - name: Verify unsupported hardware is not misrepresented as benchmarked
        working-directory: products/multigpu-optimization
        run: |
          grep -q "does not query GPUs" README.md
          grep -q "Benchmark the exact model" README.md
