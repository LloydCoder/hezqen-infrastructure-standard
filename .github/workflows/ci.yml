name: HIES CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hies-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate schemas and manifest tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "refs/pull/${{ github.event.pull_request.number }}/merge"
          else
            git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD
      - name: Set up pinned Python runtime
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12.10"
      - name: Verify Python runtime
        run: python --version
      - name: Install pinned schema-validation dependency
        run: "python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: -r requirements-dev.txt"
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON Schema Draft 2020-12 contracts and fixtures
        run: python scripts/validate-schemas.py
      - name: Validate all checked-in JSON documents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path(".").rglob("*.json"))
          files = [p for p in files if ".git" not in p.parts]
          assert files, "No JSON documents found"
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"VALID {path}")
          PY
      - name: Validate mandatory standards are present
        run: |
          test -s schemas/product-manifest.schema.json
          test -s schemas/compatibility.schema.json
          test -s schemas/compatibility-matrix.schema.json
          test -s schemas/benchmark.schema.json
          test -s schemas/artifact-manifest.schema.json
          test -s standards/quality/testing-standard.md
          test -s standards/security/secure-container-baseline.md
          test -s standards/security/release-integrity.md
      - name: Scan repository for obvious credential patterns
        run: python scripts/check-repo-hygiene.py .
