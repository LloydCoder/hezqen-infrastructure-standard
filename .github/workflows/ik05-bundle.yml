name: IK-05 Offline Bundle Acceptance

on:
  pull_request:
    paths:
      - "bundle/**"
      - "scripts/bundle.py"
      - "tests/test_bundle.py"
      - "products/**"
      - ".github/workflows/ik05-bundle.yml"
  push:
    branches: [main]
    paths:
      - "bundle/**"
      - "scripts/bundle.py"
      - "tests/test_bundle.py"
      - "products/**"
      - ".github/workflows/ik05-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ik05-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-bundle:
    name: Build, verify, and install offline bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned Python runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
      - name: Run bundle regression tests
        run: python -m unittest tests.test_bundle -v
      - name: Build source-bound offline distribution
        run: python scripts/bundle.py build --output "$RUNNER_TEMP/hezqen-infrastructure-bundle" --source-revision "$GITHUB_SHA"
      - name: Verify archive checksums, product identity, and SBOM
        run: python scripts/bundle.py verify "$RUNNER_TEMP/hezqen-infrastructure-bundle"
      - name: Install bundle without network access
        run: python scripts/bundle.py install "$RUNNER_TEMP/hezqen-infrastructure-bundle" --destination "$RUNNER_TEMP/hezqen-installed"
      - name: Verify installed product inventory and contents
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "hezqen-installed" / "products"
          expected = {"local-ai-deployment", "pii-protection", "multigpu-optimization", "airgapped-rag"}
          actual = {path.name for path in root.iterdir() if path.is_dir()}
          assert actual == expected, (actual, expected)
          for product in sorted(expected):
              manifest = json.loads((root / product / "product-manifest.json").read_text())
              assert manifest["id"] == product
              print(f"INSTALLED {product} {manifest['version']}")
          PY
      - name: Upload verified offline bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hezqen-infrastructure-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/hezqen-infrastructure-bundle/
          if-no-files-found: error
          retention-days: 30
