name: IK-04 Disconnected RAG Runtime

on:
  pull_request:
    paths:
      - "products/airgapped-rag/**"
      - "products/local-ai-deployment/Dockerfile.ollama"
      - "tests/test_airgapped_rag.py"
      - ".github/workflows/ik04-offline-runtime.yml"
  push:
    branches: [main]
    paths:
      - "products/airgapped-rag/**"
      - "products/local-ai-deployment/Dockerfile.ollama"
      - "tests/test_airgapped_rag.py"
      - ".github/workflows/ik04-offline-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ik04-offline-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-runtime:
    name: Linux amd64 offline image/model import and local RAG acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OLLAMA_IMAGE: hezqen/ollama:0.40.16-nonroot
      QDRANT_IMAGE: qdrant/qdrant:v1.20.1-unprivileged@sha256:d18c8e5061be3eaea2f53fbee1f0bf0382dc59cbb9b7112e41ffcc937ec14220
      RAG_API_IMAGE: hezqen/airgapped-rag-api:0.1.0
      OLLAMA_VOLUME: hezqen-airgapped-rag_ollama_data
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Docker and Compose
        run: |
          docker version
          docker compose version
          docker buildx version
      - name: Build non-root Ollama image and prepare model artifacts while connected
        working-directory: products/airgapped-rag
        run: |
          docker build --pull -f ../local-ai-deployment/Dockerfile.ollama \
            --build-arg "BASE_IMAGE=ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592" \
            -t "$OLLAMA_IMAGE" ../local-ai-deployment
          bash scripts/prepare-models.sh
      - name: Package pinned images and model volume for offline transfer
        working-directory: products/airgapped-rag
        run: |
          docker compose config --quiet
          bash scripts/package-offline.sh "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/hezqen-airgapped-rag-offline-0.1.0/images.tar"
          test -s "$RUNNER_TEMP/hezqen-airgapped-rag-offline-0.1.0/models.tar.gz"
          (cd "$RUNNER_TEMP/hezqen-airgapped-rag-offline-0.1.0" && sha256sum --check --strict SHA256SUMS)
      - name: Remove connected-stage images and model volume
        run: |
          docker rm -f hezqen-ollama-model-prep >/dev/null 2>&1 || true
          docker image rm -f "$OLLAMA_IMAGE" "$QDRANT_IMAGE" "$RAG_API_IMAGE" >/dev/null
          docker volume rm "$OLLAMA_VOLUME"
      - name: Install from local bundle with registry pulls disabled
        run: |
          cd "$RUNNER_TEMP/hezqen-airgapped-rag-offline-0.1.0"
          bash install.sh
      - name: Verify restored models and local service health
        run: |
          cd "$RUNNER_TEMP/hezqen-airgapped-rag-offline-0.1.0"
          docker compose ps
          docker compose exec -T ollama ollama list | tee /tmp/hezqen-models.txt
          grep -F "nomic-embed-text" /tmp/hezqen-models.txt
          grep -F "qwen2.5:0.5b" /tmp/hezqen-models.txt
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:8090/healthz | jq -e '.status == "ok"'
      - name: Verify only loopback RAG API is published
        run: |
          cd "$RUNNER_TEMP/hezqen-airgapped-rag-offline-0.1.0"
          API_ID="$(docker compose ps -q rag-api)"
          docker inspect "$API_ID" --format '{{json .HostConfig.PortBindings}}' | tee /tmp/hezqen-rag-api-ports.json
          jq -e '."8090/tcp"[0].HostIp == "127.0.0.1" and ."8090/tcp"[0].HostPort == "8090"' /tmp/hezqen-rag-api-ports.json
          for service in ollama qdrant; do
            ID="$(docker compose ps -q "$service")"
            docker inspect "$ID" --format '{{json .HostConfig.PortBindings}}' | jq -e 'length == 0'
          done
      - name: Verify offline document ingestion and vector retrieval
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8090/v1/ingest \
            -H 'Content-Type: application/json' \
            -d '{"documents":[{"id":"offline-runbook-1","text":"The local operations runbook says verify service health before shutdown. The RAG stack stores embeddings in the local Qdrant vector database."}]}' \
            | jq -e '.documents == 1 and .chunks == 1'
          curl --fail --silent --show-error http://127.0.0.1:8090/v1/query \
            -H 'Content-Type: application/json' \
            -d '{"query":"What should an operator verify before shutdown?","top_k":3}' \
            | jq -e '.results[0].source_id == "offline-runbook-1"'
      - name: Verify grounded local chat and source attribution
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8090/v1/chat \
            -H 'Content-Type: application/json' \
            -d '{"query":"What should an operator verify before shutdown?","top_k":3}' \
            | jq -e '.answer | type == "string" and length > 0' 
          curl --fail --silent --show-error http://127.0.0.1:8090/v1/chat \
            -H 'Content-Type: application/json' \
            -d '{"query":"What should an operator verify before shutdown?","top_k":3}' \
            | jq -e '.sources[0].source_id == "offline-runbook-1"'
      - name: Verify RAG API has no direct Internet egress
        run: |
          cd "$RUNNER_TEMP/hezqen-airgapped-rag-offline-0.1.0"
          if docker compose exec -T rag-api python -c "import socket; socket.create_connection(('1.1.1.1', 443), timeout=3)" >/dev/null 2>&1; then
            echo "RAG API unexpectedly has direct Internet egress" >&2
            exit 1
          fi
      - name: Collect service logs on failure
        if: failure()
        run: |
          cd "$RUNNER_TEMP/hezqen-airgapped-rag-offline-0.1.0"
          docker compose logs --no-color --tail=200 || true
      - name: Tear down offline stack and temporary artifacts
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/hezqen-airgapped-rag-offline-0.1.0/compose.yaml" ]]; then
            cd "$RUNNER_TEMP/hezqen-airgapped-rag-offline-0.1.0"
            docker compose down -v --remove-orphans || true
          fi
          docker volume rm "$OLLAMA_VOLUME" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/hezqen-airgapped-rag-offline-0.1.0"
